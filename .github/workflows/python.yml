# Temporary low-minute CI; restore comprehensive checks via the cleanup issue.
name: Python

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Ubuntu / Python 3.13 sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install gettext
        run: sudo apt-get install -y gettext
      - name: Build extension and translations
        run: |
          uv sync --python 3.13
          uv run maturin develop
          uv run just bootstrap
      - name: Python tests and lint
        run: |
          uv run pytest -q
          uv run ruff check
          uv run ruff format --check
      - name: Rust tests and lint
        run: |
          export PYO3_PYTHON="$PWD/.venv/bin/python"
          export PYTHONPATH="$PWD:$PWD/.venv/lib/python3.13/site-packages"
          cargo test --workspace -- --test-threads=1
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
