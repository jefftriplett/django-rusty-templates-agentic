# PRs run sanity only; the platform matrix is dispatched manually.
name: Python

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Ubuntu / Python 3.13 sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: sanity-py313
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: sanity-py313
      - name: Install gettext
        run: sudo apt-get install -y gettext
      - name: Build extension and translations
        run: |
          uv sync --python 3.13
          uv run maturin develop
          uv run -m django compilemessages
      - name: Python tests and lint
        run: |
          uv run pytest -q
          uv run ruff check
          uv run ruff format --check
      - name: Rust tests and lint
        run: |
          export PYO3_PYTHON="$PWD/.venv/bin/python"
          export PYTHONPATH="$PWD/python:$PWD:$PWD/.venv/lib/python3.13/site-packages"
          cargo test --workspace -- --test-threads=1
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
        django-version: ["5.2"]
        include:
          # Exact final versions; Django 5.2/6.0 are excluded on Python 3.15.
          - os: ubuntu-24.04
            python-version: "3.15.0"
            django-version: "6.1"
          - os: macos-latest
            python-version: "3.15.0"
            django-version: "6.1"
          - os: windows-latest
            python-version: "3.15.0"
            django-version: "6.1"
          - os: ubuntu-24.04
            python-version: "3.15.0t"
            django-version: "6.1"
          - os: macos-latest
            python-version: "3.15.0t"
            django-version: "6.1"
          - os: windows-latest
            python-version: "3.15.0t"
            django-version: "6.1"
        exclude:
          # Already covered by the required sanity job.
          - os: ubuntu-24.04
            python-version: "3.13"
    steps:
      - name: Configure Windows line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !startsWith(matrix.python-version, '3.15.') }}
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: python-${{ matrix.os }}-${{ matrix.python-version }}-django${{ matrix.django-version }}
      - name: Install final Python 3.15 with uv
        if: startsWith(matrix.python-version, '3.15.')
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: python-${{ matrix.python-version }}
      - name: Install gettext (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gettext
      - name: Install gettext (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - name: Install gettext (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install gettext -y --no-progress
          echo "C:/Program Files/gettext-iconv/bin" >> "$GITHUB_PATH"
      - name: Build extension and translations
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          DJANGO_SERIES: ${{ matrix.django-version }}
        run: |
          uv sync --python "$PYTHON_VERSION"
          if [[ "$DJANGO_SERIES" == "6.1" ]]; then
            uv pip install "Django>=6.1,<6.2"
          fi
          uv run --no-sync python -c 'import os, sys, django; assert sys.version_info.releaselevel == "final"; assert django.VERSION[:2] == tuple(map(int, os.environ["DJANGO_SERIES"].split(".")))'
          uv run --no-sync maturin develop
          uv run --no-sync -m django compilemessages
      - name: Python tests
        if: runner.os != 'macOS' || matrix.python-version != '3.13'
        run: uv run --no-sync pytest -q
      - name: Python coverage (macOS / 3.13)
        if: runner.os == 'macOS' && matrix.python-version == '3.13'
        run: uv run --no-sync pytest --cov=django_rusty_templates --cov-report=xml
      - name: Save local coverage report
        if: runner.os == 'macOS' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 7
