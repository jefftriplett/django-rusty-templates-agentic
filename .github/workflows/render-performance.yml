name: Render performance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'python/**'
      - 'dtl-lexer/**'
      - 'scripts/benchmark_loop_values.py'
      - '.github/workflows/render-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install matching dependencies
        run: uv sync --python 3.13
      - name: Build and measure PR base
        run: |
          git worktree add --detach "$RUNNER_TEMP/rusty-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/rusty-base"
          VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" "$GITHUB_WORKSPACE/.venv/bin/maturin" develop --release
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/benchmark_loop_values.py" --json-output "$RUNNER_TEMP/base.json"
      - name: Build and measure candidate
        run: |
          uv run maturin develop --release
          uv run python scripts/benchmark_loop_values.py --json-output "$RUNNER_TEMP/candidate.json" --baseline "$RUNNER_TEMP/base.json" --max-regression 0.15
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: render-performance
          path: |
            ${{ runner.temp }}/base.json
            ${{ runner.temp }}/candidate.json
