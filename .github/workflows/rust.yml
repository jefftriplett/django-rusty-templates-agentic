name: Rust

# Comprehensive checks are manual while the private fork uses minimal CI.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: ${{ github.workspace }}

# Cancel running jobs for the same workflow and branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - name: Install dependencies
      run: uv sync
      env:
        UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@c06f6a0003f7c6165a00c89d1697731c9e8a5c72  # v1.25.2
    - name: Install cargo-llvm-cov
      run: cargo binstall cargo-llvm-cov
    - name: Run tests
      env:
        # Embedded Python imports can deadlock across Rust test threads.
        RUST_TEST_THREADS: "1"
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
