name: Rust

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: ${{ github.workspace }}

# Cancel running jobs for the same workflow and branch.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-24.04", "windows-latest"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-suffix: rust-py314
    - name: Install dependencies
      run: uv sync
      env:
        UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        shared-key: rust-coverage-py314
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc  # v1.25.3
    - name: Install cargo-llvm-cov
      run: cargo binstall --no-confirm cargo-llvm-cov
    - name: Run tests
      env:
        # Embedded Python imports can deadlock across Rust test threads.
        RUST_TEST_THREADS: "1"
      run: |
        export PYO3_PYTHON="$pythonLocation/bin/python"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          export PYO3_PYTHON="$pythonLocation/python.exe"
        fi
        cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info -- --test-threads=1
    - name: Save Rust coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rust-coverage-${{ matrix.os }}
        path: lcov.info
        retention-days: 7
